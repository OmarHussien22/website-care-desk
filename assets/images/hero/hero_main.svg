<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="40" y1="40" x2="440" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="statA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="statB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="statC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect width="480" height="400" rx="20" fill="#F0F9FF"/>

  <!-- Decorative blurred accents -->
  <circle cx="60" cy="60" r="60" fill="#22D3EE" opacity="0.10"/>
  <circle cx="430" cy="360" r="80" fill="#0EA5E9" opacity="0.12"/>

  <!-- Main dashboard card (faux shadow via offset duplicate) -->
  <rect x="40" y="46" width="400" height="320" rx="14" fill="#0F172A" opacity="0.08"/>
  <g>
    <rect x="40" y="40" width="400" height="320" rx="14" fill="url(#cardGrad)"/>

    <!-- Header -->
    <rect x="40" y="40" width="400" height="60" rx="14" fill="url(#headerGrad)"/>
    <rect x="40" y="88" width="400" height="12" fill="url(#headerGrad)"/>
    <circle cx="72" cy="70" r="14" fill="white" opacity="0.30"/>
    <path d="M67 70 L71 74 L77 66" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="96" y="62" width="100" height="7" rx="3.5" fill="white" opacity="0.95"/>
    <rect x="96" y="74" width="60" height="5" rx="2.5" fill="white" opacity="0.6"/>

    <!-- Search pill -->
    <rect x="296" y="58" width="128" height="24" rx="12" fill="white" opacity="0.16"/>
    <circle cx="308" cy="70" r="3.5" stroke="white" stroke-width="1.5" fill="none"/>
    <line x1="310.5" y1="72.5" x2="313" y2="75" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stats row -->
    <rect x="56" y="120" width="116" height="84" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="68" y="132" width="40" height="6" rx="3" fill="#94A3B8"/>
    <text x="68" y="166" font-family="Montserrat, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">128</text>
    <rect x="68" y="178" width="64" height="6" rx="3" fill="url(#statA)"/>
    <path d="M118 168 L130 162 L134 166 L150 152" stroke="url(#statA)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <rect x="182" y="120" width="116" height="84" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="194" y="132" width="40" height="6" rx="3" fill="#94A3B8"/>
    <text x="194" y="166" font-family="Montserrat, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">96%</text>
    <rect x="194" y="178" width="72" height="6" rx="3" fill="url(#statB)"/>
    <path d="M244 170 L256 158 L264 162 L274 152" stroke="url(#statB)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <rect x="308" y="120" width="116" height="84" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="320" y="132" width="40" height="6" rx="3" fill="#94A3B8"/>
    <text x="320" y="166" font-family="Montserrat, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">4.9</text>
    <rect x="320" y="178" width="56" height="6" rx="3" fill="url(#statC)"/>
    <path d="M370 168 L382 156 L390 162 L400 152" stroke="url(#statC)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Appointment list -->
    <rect x="56" y="220" width="368" height="46" rx="10" fill="#F8FAFC"/>
    <circle cx="80" cy="243" r="14" fill="#DBEAFE"/>
    <path d="M75 243 L79 247 L86 239" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="104" y="232" width="120" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="104" y="246" width="70" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="360" y="232" width="56" height="14" rx="7" fill="#DCFCE7"/>
    <text x="370" y="243" font-family="Montserrat, system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803D">CONFIRMED</text>

    <rect x="56" y="276" width="368" height="46" rx="10" fill="#F8FAFC"/>
    <circle cx="80" cy="299" r="14" fill="#FEF3C7"/>
    <path d="M80 293 V299 L84 303" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="104" y="288" width="100" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="104" y="302" width="60" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="360" y="288" width="56" height="14" rx="7" fill="#FEF9C3"/>
    <text x="378" y="299" font-family="Montserrat, system-ui, sans-serif" font-size="9" font-weight="700" fill="#A16207">PENDING</text>

    <rect x="56" y="332" width="368" height="20" rx="10" fill="#F1F5F9"/>
    <rect x="68" y="338" width="80" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- Floating notification card (faux shadow) -->
  <rect x="296" y="296" width="160" height="68" rx="14" fill="#0EA5E9" opacity="0.18"/>
  <g>
    <rect x="296" y="290" width="160" height="68" rx="14" fill="white"/>
    <circle cx="320" cy="324" r="12" fill="#DCFCE7"/>
    <path d="M315 324 L319 328 L326 320" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="340" y="306" width="100" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="340" y="320" width="80" height="5" rx="2.5" fill="#64748B"/>
    <rect x="340" y="330" width="56" height="5" rx="2.5" fill="#64748B"/>
  </g>

  <!-- Floating heartbeat badge (faux shadow) -->
  <circle cx="60" cy="284" r="28" fill="#0EA5E9" opacity="0.20"/>
  <g>
    <circle cx="60" cy="280" r="28" fill="white"/>
    <path d="M48 280 L55 280 L58 274 L62 286 L65 278 L72 278" stroke="#0EA5E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
