name: coursaty
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter


  # ---------------------- Core & State Management ----------------------
  get: ^4.7.3
  get_storage: ^2.1.1
  shared_preferences: ^2.3.2
  equatable: ^2.0.5
  intl: ^0.20.2

  # ---------------------- Networking ----------------------
  dio: ^4.0.6
  cached_network_image: ^3.3.1

  # ---------------------- UI & Styling ----------------------
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  flutter_spinkit: ^5.1.0
  loading_animation_widget: ^1.2.0+3
  lottie: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  skeletonizer: ^1.4.2
  showcaseview: ^4.0.1
  fluttertoast: ^8.1.1
  pin_code_fields: ^8.0.1
  turnable_page: ^1.0.0

  # ---------------------- Firebase ----------------------
  firebase_core: ^3.15.1
  firebase_remote_config: ^5.5.0

  # ---------------------- Utilities & Hardware ----------------------
  connectivity_plus: ^6.1.1
  device_info_plus: ^11.5.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.1.6
  wakelock_plus: ^1.2.10
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  no_screenshot: ^0.3.1
  whatsapp_unilink: ^2.1.0

  # ---------------------- Monitoring & Error Handling ----------------------
  sentry_flutter: ^9.6.0
  stack_trace: ^1.11.1


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: URW
      fonts:
        - asset: assets/core/fonts/uRW/uRW_Thin.ttf
          weight: 100
        - asset: assets/core/fonts/uRW/uRW_Light.ttf
          weight: 200
        - asset: assets/core/fonts/uRW/uRW_XLight.ttf
          weight: 300
        - asset: assets/core/fonts/uRW/uRW_regular.ttf
          weight: 400
        - asset: assets/core/fonts/uRW/uRW_Medium.ttf
          weight: 500
        - asset: assets/core/fonts/uRW/uRW_Demi.ttf
          weight: 600
        - asset: assets/core/fonts/uRW/uRW_Bold.ttf
          weight: 700
        - asset: assets/core/fonts/uRW/uRW_Black.ttf
          weight: 900
    - family: Montserrat
      fonts:
        - asset: assets/core/fonts/montserrat-Thin.ttf
          weight: 100
        - asset: assets/core/fonts/montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/core/fonts/montserrat-Light.ttf
          weight: 300
        - asset: assets/core/fonts/montserrat-Regular.ttf
          weight: 400
        - asset: assets/core/fonts/montserrat-Medium.ttf
          weight: 500
        - asset: assets/core/fonts/montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/core/fonts/montserrat-Bold.ttf
          weight: 700
        - asset: assets/core/fonts/montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/core/fonts/montserrat-Black.ttf
          weight: 900
