name: coursaty
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ---------------------- Core & State Management ----------------------
  get: ^4.7.3
  get_storage: ^2.1.1
  shared_preferences: ^2.3.2
  equatable: ^2.0.5
  intl: ^0.20.2

  # ---------------------- Networking ----------------------
  dio: ^5.5.0
  cached_network_image: ^3.3.1
  pretty_dio_logger: ^1.4.0

  # ---------------------- UI & Styling ----------------------
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  flutter_spinkit: ^5.1.0
  loading_animation_widget: ^1.2.0+3
  lottie: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  skeletonizer: ^2.1.3
  showcaseview: ^5.0.2
  fluttertoast: ^9.0.0
  pin_code_fields: ^9.3.0
  turnable_page: ^1.0.0
  flutter_rounded_date_picker: ^3.0.4
  flutter_staggered_animations: ^1.1.1
  iconsax: ^0.0.8
  flutter_widget_from_html: ^0.17.2
  carousel_slider: ^5.1.2
  flutter_styled_toast: ^2.3.0
  country_code_picker: ^3.4.1
  visibility_detector: ^0.4.0+2

  # ---------------------- Firebase ----------------------
  firebase_core: ^4.7.0
  firebase_remote_config: ^6.4.0

  # ---------------------- Utilities & Hardware ----------------------
  connectivity_plus: ^7.1.1
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.1.6
  wakelock_plus: ^1.2.10
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  no_screenshot: ^1.1.0
  whatsapp_unilink: ^2.1.0
  mime: ^2.0.0

  # ---------------------- Monitoring & Error Handling ----------------------
  sentry_flutter: ^9.6.0
  stack_trace: ^1.11.1
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/brand/
    - assets/images/hero/
    - assets/images/social/
    - assets/fonts/uRW/
    - assets/fonts/montserrat/

  fonts:
    - family: URW
      fonts:
        - asset: assets/fonts/uRW/uRW_Thin.ttf
          weight: 100
        - asset: assets/fonts/uRW/uRW_Light.ttf
          weight: 200
        - asset: assets/fonts/uRW/uRW_XLight.ttf
          weight: 300
        - asset: assets/fonts/uRW/uRW_regular.ttf
          weight: 400
        - asset: assets/fonts/uRW/uRW_Medium.ttf
          weight: 500
        - asset: assets/fonts/uRW/uRW_Demi.ttf
          weight: 600
        - asset: assets/fonts/uRW/uRW_Bold.ttf
          weight: 700
        - asset: assets/fonts/uRW/uRW_Black.ttf
          weight: 900
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/montserrat/montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/montserrat/montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/montserrat/montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat/montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/montserrat/montserrat-Black.ttf
          weight: 900
