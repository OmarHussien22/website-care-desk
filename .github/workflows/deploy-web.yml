name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    env:
      MEDDESK_API_BASE_URL: ${{ vars.MEDDESK_API_BASE_URL }}
      MEDDESK_DASHBOARD_BASE_URL: ${{ vars.MEDDESK_DASHBOARD_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate production configuration
        run: |
          if [[ -z "$MEDDESK_API_BASE_URL" ]]; then
            echo "::error::Repository variable MEDDESK_API_BASE_URL is required."
            exit 1
          fi

          if [[ -z "$MEDDESK_DASHBOARD_BASE_URL" ]]; then
            echo "::error::Repository variable MEDDESK_DASHBOARD_BASE_URL is required."
            exit 1
          fi

      - name: Build Flutter Web
        env:
          BASE_HREF: ${{ steps.pages.outputs.base_path }}/
        run: |
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=MEDDESK_API_BASE_URL="$MEDDESK_API_BASE_URL" \
            --dart-define=MEDDESK_DASHBOARD_BASE_URL="$MEDDESK_DASHBOARD_BASE_URL"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
