<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedDesk is a modern clinic management system for patients, appointments, medical records, billing, doctors, receptionists, reports, and notifications.">
  <meta name="keywords" content="Clinic Management System, Medical Clinic Software, Doctor Management System, Patient Management, Appointment Management, نظام إدارة العيادات">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f3a52">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MedDesk">
  <meta property="og:title" content="MedDesk — Modern Clinic Management System">
  <meta property="og:description" content="Manage patients, appointments, medical records, billing, teams, reports, and notifications in one place.">
  <meta property="og:image" content="icons/meddesk-social.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MedDesk — Modern Clinic Management System">
  <meta name="twitter:description" content="Everything your clinic needs, in one place.">
  <meta name="twitter:image" content="icons/meddesk-social.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MedDesk">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>MedDesk — Clinic Management System</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/montserrat/montserrat-Regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>
    html, body { margin: 0; background: #f8fafc; }
    #meddesk-startup { min-height: 100svh; display: grid; place-content: center;
      gap: 18px; text-align: center; color: #0f3a52; font: 600 20px system-ui, sans-serif; }
    #meddesk-startup .mark { margin: auto; width: 64px; height: 64px;
      border-radius: 20px; background: #0f3a52; color: white;
      display: grid; place-content: center; font-size: 40px; font-weight: 300; }
    #meddesk-startup .track { width: 128px; height: 3px; margin: auto;
      overflow: hidden; border-radius: 4px; background: #dce8e9; }
    #meddesk-startup .track::after { content: ''; display: block; width: 48px;
      height: 100%; background: #2f7d99; animation: loading 1.2s ease-in-out infinite alternate; }
    @keyframes loading { to { transform: translateX(80px); } }
    @media (prefers-reduced-motion: reduce) {
      #meddesk-startup .track::after { animation: none; width: 100%; }
    }
  </style>
  <div id="meddesk-startup" role="status" aria-label="جاري تحميل MedDesk · Loading MedDesk">
    <div class="mark" aria-hidden="true">+</div>
    <span>MedDesk</span>
    <div class="track" aria-hidden="true"></div>
  </div>
  <noscript>يرجى تفعيل JavaScript لاستخدام MedDesk. Please enable JavaScript to use MedDesk.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('meddesk-startup')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
